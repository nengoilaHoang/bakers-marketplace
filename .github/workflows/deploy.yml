name: Deploy to Server
on:
  push:
    branches:
      - main
jobs:
  # JOB 1: Build và đẩy lên Docker Hub
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mã nguồn từ GitHub
        uses: actions/checkout@v4
        
      - name: Đăng nhập vào Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          
      - name: Build Image và đẩy lên Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./be/Dockerfile
          push: true
          tags: nengoilahoang/bakers-marketplace-be:latest

  # JOB 2: Deploy lên Server qua SSH
  deploy-to-server:
    needs: build-and-push # Bắt buộc Job 1 xong mới chạy Job 2
    runs-on: ubuntu-latest
    steps:
      - name: SSH và Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: azureuser
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /home/azureuser/hostweb/bakers-marketplace
            
            # 1. Tắt hệ thống cũ và xóa volume (CẢNH BÁO: Xóa cả DB, xem lưu ý bên dưới)
            sudo docker compose down -v
            
            # 2. Xóa image backend cũ để đảm bảo tải bản mới sạch sẽ
            sudo docker rmi nengoilahoang/bakers-marketplace-be:latest || true
            
            # 3. Kéo image mới nhất vừa build trên Docker Hub về
            sudo docker pull nengoilahoang/bakers-marketplace-be:latest
            
            # 4. Khởi động lại toàn bộ services
            sudo docker compose up -d